      <div class="tilt-debug" id="tiltDebug">0°</div>

      <button class="btn btn-primary permission-card" id="permissionBtn" hidden>기울기 센서 사용 허용</button>
    </section>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const MAX_ANGLE = 45;
    const MAX_OPACITY = 0.9;

    function showScreen(id){
      document.querySelectorAll(".screen").forEach(s => s.hidden = (s.id !== id));
      if (id === "screen-display") fitHome();
    }

    // Figma 360x780 기준 홈화면을 화면 크기에 맞춰 비율 유지로 축소/확대
    function fitHome(){
      const scr = el("screen-display");
      const w = scr.clientWidth, h = scr.clientHeight;
      if (!w || !h) return;
      const s = Math.max(0.5, Math.min(w / 360, h / 780, 1.3));
      scr.style.setProperty("--s", s.toFixed(4));
    }
    window.addEventListener("resize", fitHome);

    function applyTilt(gamma){
      if (typeof gamma !== "number") return;
      const clampedAngle = Math.min(Math.abs(gamma), MAX_ANGLE);
      const opacity = (clampedAngle / MAX_ANGLE) * MAX_OPACITY;
      el("privacyOverlay").style.opacity = opacity.toFixed(3);
      el("tiltDebug").textContent = Math.round(gamma) + "°";
    }

    function onOrientation(e){
      applyTilt(e.gamma);
    }

    function startTiltWatch(){
      window.addEventListener("deviceorientation", onOrientation);
    }

    function stopTiltWatch(){
      window.removeEventListener("deviceorientation", onOrientation);
      applyTilt(0);
    }

    async function enterDisplay(){
      showScreen("screen-display");
      el("permissionBtn").hidden = true;

      const needsPermission = typeof DeviceOrientationEvent !== "undefined"
        && typeof DeviceOrientationEvent.requestPermission === "function";

      if (needsPermission) {
        el("permissionBtn").hidden = false;
        el("permissionBtn").onclick = async () => {
          try {
            const result = await DeviceOrientationEvent.requestPermission();
            if (result === "granted") {
              el("permissionBtn").hidden = true;
              startTiltWatch();
            } else {
              el("permissionBtn").textContent = "센서 권한이 거부되었습니다";
            }
          } catch (err) {
            el("permissionBtn").textContent = "센서를 사용할 수 없습니다";
          }
        };
      } else {
        startTiltWatch();
      }
    }

    el("startBtn").onclick = () => enterDisplay();
    el("closeDisplayBtn").onclick = () => {
      stopTiltWatch();
      showScreen("screen-intro");
    };
  </script>
