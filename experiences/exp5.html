<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Try-On | Try Galaxy Demo</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/artryon.css" />
</head>
<body>
  <div class="app-frame">
    <div class="experience-page">
      <section class="screen" id="screen-intro">
        <h1>AR Try-On</h1>
        <p class="hint">워치는 손목, 반지는 검지에 맞춰 따라다니는 기술 검증용 프로토타입입니다. 지금은 실제 제품 이미지 대신 임의의 플레이스홀더 이미지를 사용합니다.</p>
        <button class="btn btn-primary" id="startBtn">시작하기</button>
        <a class="back-link" href="../index.html">← 홈으로 돌아가기</a>
      </section>
    </div>

    <section class="screen ar-screen" id="screen-ar" hidden>
      <video id="arVideo" autoplay muted playsinline webkit-playsinline></video>
      <canvas id="arCanvas"></canvas>

      <button class="ar-back" id="closeArBtn" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
      </button>

      <div class="ar-status" id="arStatus">손목을 비춰보세요</div>

      <div class="ar-toggle">
        <button class="ar-toggle-btn is-active" id="modeWatchBtn" data-mode="watch">워치</button>
        <button class="ar-toggle-btn" id="modeRingBtn" data-mode="ring">반지</button>
      </div>

      <button class="ar-tune-btn" id="tuneBtn" aria-label="크기와 위치 조절">맞춤</button>
      <div class="ar-tune" id="tunePanel" hidden>
        <div class="ar-tune-row">
          <label for="tuneSize">크기</label>
          <input type="range" id="tuneSize" min="50" max="160" step="1" />
          <output id="tuneSizeVal"></output>
        </div>
        <div class="ar-tune-row">
          <label for="tuneShift">위치</label>
          <input type="range" id="tuneShift" min="-30" max="60" step="1" />
          <output id="tuneShiftVal"></output>
        </div>
        <button class="ar-tune-reset" id="tuneReset">초기화</button>
      </div>
    </section>
  </div>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9";

    const el = (id) => document.getElementById(id);
    const video = el("arVideo");
    const canvas = el("arCanvas");
    const ctx = canvas.getContext("2d");

    let stream = null;
    let loopActive = false;
    let mode = "watch"; // "watch" | "ring"

    let filesetResolver = null;
    let handLandmarker = null;

    const IMAGES = {};
    function loadImage(src){
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = src;
      });
    }

    /* 투명 PNG가 실제 제품보다 훨씬 큰 여백을 가진 경우(예: 원본 캔버스 그대로)를 대비해,
       알파 채널을 스캔해서 실제 콘텐츠가 차지하는 영역만 잘라낸다. */
    function computeAlphaBBox(img){
      const fallback = { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight };
      try {
        const off = document.createElement("canvas");
        off.width = img.naturalWidth;
        off.height = img.naturalHeight;
        const offCtx = off.getContext("2d", { willReadFrequently: true });
        offCtx.drawImage(img, 0, 0);
        const { data } = offCtx.getImageData(0, 0, off.width, off.height);

        let minX = off.width, minY = off.height, maxX = 0, maxY = 0;
        for (let y = 0; y < off.height; y++) {
          for (let x = 0; x < off.width; x++) {
            if (data[(y * off.width + x) * 4 + 3] > 10) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX < minX || maxY < minY) return fallback;

        const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.02);
        minX = Math.max(0, minX - pad);
        minY = Math.max(0, minY - pad);
        maxX = Math.min(off.width - 1, maxX + pad);
        maxY = Math.min(off.height - 1, maxY + pad);
        return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
      } catch (e) {
        // file://로 열어 캔버스가 오염된 경우 등 — 크롭 없이 원본 전체를 그대로 사용
        console.warn("alpha bbox 계산 실패, 원본 이미지를 그대로 사용합니다:", e);
        return fallback;
      }
    }

    async function loadCroppedImage(src){
      const img = await loadImage(src);
      return { img, bbox: computeAlphaBBox(img) };
    }

    function showScreen(id){
      document.querySelectorAll(".screen").forEach(s => s.hidden = (s.id !== id));
    }

    async function openCamera(){
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
      } catch (e) {
        alert("카메라 권한을 확인해주세요. (" + e.message + ")");
        showScreen("screen-intro");
        return false;
      }
      video.srcObject = stream;
      return true;
    }

    function closeCamera(){
      loopActive = false;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    }

    function resizeCanvas(){
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }

    async function ensureFileset(){
      if (filesetResolver) return filesetResolver;
      filesetResolver = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm"
      );
      return filesetResolver;
    }

    async function ensureHandLandmarker(){
      if (handLandmarker) return handLandmarker;
      const fs = await ensureFileset();
      handLandmarker = await HandLandmarker.createFromOptions(fs, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numHands: 1
      });
      return handLandmarker;
    }

    /*
     * One Euro 필터 — 가만히 있을 땐 떨림을 없애고, 빠르게 움직일 땐 지연 없이 따라가도록 컷오프를 속도에 따라 조절.
     * 손 인식 좌표는 프레임마다 조금씩 떨리는데, 그대로 그리면 워치/반지 크기와 위치가 계속 흔들린다.
     */
    const smoothAlpha = (cutoff, dt) => 1 / (1 + (1 / (2 * Math.PI * cutoff)) / dt);

    class OneEuro {
      constructor(minCutoff, beta, dCutoff = 1){
        this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
        this.reset();
      }
      reset(){ this.x = null; this.dx = 0; this.t = null; }
      filter(x, t){
        if (this.x === null) { this.x = x; this.t = t; return x; }
        const dt = Math.max(1e-3, t - this.t);
        const rawDx = (x - this.x) / dt;
        this.dx += smoothAlpha(this.dCutoff, dt) * (rawDx - this.dx);
        const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
        this.x += smoothAlpha(cutoff, dt) * (x - this.x);
        this.t = t;
        return this.x;
      }
    }

    function makeFilters(){
      return {
        x: new OneEuro(1.5, 0.03), y: new OneEuro(1.5, 0.03),
        scale: new OneEuro(0.8, 3),
        cos: new OneEuro(1.5, 1.5), sin: new OneEuro(1.5, 1.5),
        z: new OneEuro(1, 1),
      };
    }
    const FILTERS = { watch: makeFilters(), ring: makeFilters() };
    let lastSeen = 0;

    function resetFilters(){
      Object.values(FILTERS).forEach((set) => Object.values(set).forEach((f) => f.reset()));
    }

    function smoothPose(f, pose, now){
      const t = now / 1000;
      return {
        center: { x: f.x.filter(pose.center.x, t), y: f.y.filter(pose.center.y, t) },
        scale: f.scale.filter(pose.scale, t),
        // 각도는 360도 경계에서 튀지 않도록 sin/cos 성분으로 나눠 필터링
        angle: Math.atan2(f.sin.filter(Math.sin(pose.angle), t), f.cos.filter(Math.cos(pose.angle), t)),
      };
    }

    /* 3D 거리(캔버스 px) — 손이 기울거나 돌아가도 값이 변하지 않아 크기 기준으로 안정적 (z는 x와 비슷한 스케일) */
    function dist3D(landmarks, a, b, videoW, videoH, canvasW, canvasH){
      const vs = Math.max(canvasW / videoW, canvasH / videoH);
      const dx = (landmarks[a].x - landmarks[b].x) * videoW;
      const dy = (landmarks[a].y - landmarks[b].y) * videoH;
      const dz = (landmarks[a].z - landmarks[b].z) * videoW;
      return Math.hypot(dx, dy, dz) * vs;
    }

    // 워치 기본값: 크기 = 손바닥 폭의 1.05배, 위치 = 손바닥 끝에서 팔 쪽으로 손바닥 길이의 18% (슬라이더로 추가 조절)
    const WATCH_BASE_RATIO = 1.05;
    const WATCH_BASE_SHIFT = 0.18;

    /* 크기/위치 미세 조정 — 모드(워치/반지)별로 저장해 두고 다음 방문에도 유지 */
    const TUNE_KEY = "tg-ar-tune-v1";
    const TUNE = { watch: { size: 100, shift: 0 }, ring: { size: 100, shift: 0 } };
    try {
      const saved = JSON.parse(localStorage.getItem(TUNE_KEY) || "null");
      if (saved) ["watch", "ring"].forEach((m) => { if (saved[m]) Object.assign(TUNE[m], saved[m]); });
    } catch (e) { /* 저장소를 못 쓰는 환경이면 기본값 사용 */ }

    function saveTune(){
      try { localStorage.setItem(TUNE_KEY, JSON.stringify(TUNE)); } catch (e) { /* ignore */ }
    }

    function syncTuneUI(){
      const t = TUNE[mode];
      el("tuneSize").value = t.size;
      el("tuneShift").value = t.shift;
      el("tuneSizeVal").textContent = t.size + "%";
      el("tuneShiftVal").textContent = (t.shift > 0 ? "+" : "") + t.shift + "%";
    }

    /* 정규화 좌표(0~1) → 전면카메라 거울모드(object-fit:cover) 캔버스 픽셀 좌표 */
    function mapPoint(nx, ny, videoW, videoH, canvasW, canvasH){
      const scale = Math.max(canvasW / videoW, canvasH / videoH);
      const offsetX = (canvasW - videoW * scale) / 2;
      const offsetY = (canvasH - videoH * scale) / 2;
      let x = nx * videoW * scale + offsetX;
      let y = ny * videoH * scale + offsetY;
      x = canvasW - x; // 거울모드 반전
      return { x, y };
    }

    /* entry = { img, bbox } — bbox는 투명 여백을 뺀 실제 콘텐츠 영역(알파 스캔으로 계산됨) */
    function drawEntry(entry, scaleX, scaleY){
      const { img, bbox } = entry;
      ctx.scale(scaleX, scaleY);
      ctx.drawImage(img, bbox.x, bbox.y, bbox.w, bbox.h, -bbox.w / 2, -bbox.h / 2, bbox.w, bbox.h);
    }

    function drawPlacedImage(entry, center, angle, scaleX, scaleY = scaleX){
      ctx.save();
      ctx.translate(center.x, center.y);
      ctx.rotate(angle);
      drawEntry(entry, scaleX, scaleY);
      ctx.restore();
    }

    /*
     * 정면/측면 이미지 크로스페이드 — 깊이(z) 차이로 "얼마나 돌아갔는지"를 추정해 두 이미지를 섞는다.
     * zDiff: 기준이 되는 두 랜드마크의 z 차이(부호가 돌아간 방향을 의미), zScaleForFull1: 이 값이면 완전히 측면(t=1)으로 간주.
     */
    function sideBlend(zDiff, zScaleForFull1){
      const t = Math.max(0, Math.min(1, Math.abs(zDiff) / zScaleForFull1));
      const mirror = zDiff < 0;
      return { t, mirror };
    }

    function drawBlendedImage(frontEntry, sideEntry, center, angle, scale, t, mirror){
      ctx.save();
      ctx.translate(center.x, center.y);
      ctx.rotate(angle);
      if (t < 0.98) {
        ctx.save();
        ctx.globalAlpha = 1 - t;
        drawEntry(frontEntry, scale, scale);
        ctx.restore();
      }
      if (t > 0.02) {
        ctx.save();
        ctx.globalAlpha = t;
        drawEntry(sideEntry, mirror ? -scale : scale, scale);
        ctx.restore();
      }
      ctx.restore();
    }

    function drawWatch(landmarks, videoW, videoH, now){
      const P = (i) => mapPoint(landmarks[i].x, landmarks[i].y, videoW, videoH, canvas.width, canvas.height);
      const wrist = P(0);
      const middleMcp = P(9);

      // 크기 기준: 검지-새끼 MCP 사이의 3D 거리(손이 돌아가도 일정). 손목 길이 방향 기준: 손바닥 길이(손목-중지 MCP)
      const palmWidth = dist3D(landmarks, 5, 17, videoW, videoH, canvas.width, canvas.height);
      const palmLength = dist3D(landmarks, 0, 9, videoW, videoH, canvas.width, canvas.height);

      // 손목→중지 MCP 방향(팔 축) 자체를 회전각으로 써야 밴드(로컬 세로축)가 그 축과 "수직"이 되어 손목을 가로지른다.
      const angle = Math.atan2(middleMcp.y - wrist.y, middleMcp.x - wrist.x);

      // 0번 점은 손바닥 끝이라 실제 워치를 차는 손목뼈보다 손 쪽이다 — 팔 쪽(중지 반대 방향)으로 이동시켜 손목에 올린다
      const tune = TUNE.watch;
      const armLen = Math.hypot(wrist.x - middleMcp.x, wrist.y - middleMcp.y) || 1;
      const shift = palmLength * (WATCH_BASE_SHIFT + tune.shift / 100);
      const center = {
        x: wrist.x + ((wrist.x - middleMcp.x) / armLen) * shift,
        y: wrist.y + ((wrist.y - middleMcp.y) / armLen) * shift,
      };

      // 워치 사진은 케이스(페이스)가 가장 넓은 부분이라 bbox 폭이 곧 케이스 폭
      const scale = (palmWidth * WATCH_BASE_RATIO * (tune.size / 100)) / IMAGES.watch.bbox.w;

      const pose = smoothPose(FILTERS.watch, { center, scale, angle }, now);

      // 검지-새끼 MCP의 상대 깊이(z) 차이로 손목이 돌아간 정도를 추정해 정면/측면 이미지를 섞는다 (z도 필터링)
      const zDiff = FILTERS.watch.z.filter(landmarks[5].z - landmarks[17].z, now / 1000);
      const { t, mirror } = sideBlend(zDiff, 0.12);
      drawBlendedImage(IMAGES.watch, IMAGES.watchSide, pose.center, pose.angle, pose.scale, t, mirror);
    }

    function drawRing(landmarks, videoW, videoH, now){
      const P = (i) => mapPoint(landmarks[i].x, landmarks[i].y, videoW, videoH, canvas.width, canvas.height);
      const indexMcp = P(5);
      const indexPip = P(6);

      const segLen = dist3D(landmarks, 5, 6, videoW, videoH, canvas.width, canvas.height);
      const fingerDx = indexPip.x - indexMcp.x, fingerDy = indexPip.y - indexMcp.y;
      const fingerLen2D = Math.hypot(fingerDx, fingerDy) || 1;
      const fingerAngle = Math.atan2(fingerDy, fingerDx);
      // 로컬 세로축을 손가락 방향과 "나란하게" 맞춘 뒤 세로를 찌그러뜨려야, 원통에 끼운 밴드처럼 손가락 길이 방향으로 납작해 보인다.
      const angle = fingerAngle - Math.PI / 2;

      // 위치: 검지 첫 마디 가운데에서 슬라이더만큼 손끝(+)/손바닥(-) 쪽으로 이동
      const tune = TUNE.ring;
      const mid = { x: (indexMcp.x + indexPip.x) / 2, y: (indexMcp.y + indexPip.y) / 2 };
      const shift = segLen * (tune.shift / 100);
      const center = { x: mid.x + (fingerDx / fingerLen2D) * shift, y: mid.y + (fingerDy / fingerLen2D) * shift };

      // 반지 폭은 손가락 "굵기"에 맞아야 하는데, 마디 길이(segLen)는 굵기보다 훨씬 길다 — 비율로 환산 (+1.2배 보정)
      const scale = (segLen * 0.42 * 1.2 * (tune.size / 100)) / IMAGES.ring.bbox.w;

      const pose = smoothPose(FILTERS.ring, { center, scale, angle }, now);
      // 실사 제품샷이라 이미 입체감이 있어서, 플레이스홀더만큼 세로로 많이 찌그러뜨리지 않음
      drawPlacedImage(IMAGES.ring, pose.center, pose.angle, pose.scale, pose.scale * 0.8);
    }

    async function loop(){
      if (!loopActive) return;

      if (video.readyState >= 2) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = performance.now();

        try {
          if (mode === "watch" || mode === "ring") {
            const landmarker = await ensureHandLandmarker();
            const result = landmarker.detectForVideo(video, now);
            const landmarks = result.landmarks && result.landmarks[0];
            if (landmarks) {
              lastSeen = now;
              el("arStatus").textContent = mode === "watch" ? "손목에 맞춰 표시 중" : "검지에 맞춰 표시 중";
              if (mode === "watch") drawWatch(landmarks, video.videoWidth, video.videoHeight, now);
              else drawRing(landmarks, video.videoWidth, video.videoHeight, now);
            } else {
              el("arStatus").textContent = mode === "watch" ? "손목을 비춰보세요" : "검지를 비춰보세요";
              // 손을 놓쳤다가 다시 잡을 때 이전 위치에서 끌려오지 않도록 0.3초 이상 안 보이면 필터 초기화
              if (now - lastSeen > 300) resetFilters();
            }
          }
        } catch (e) {
          el("arStatus").textContent = "모델 로딩 중...";
        }
      }

      if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(loop);
      else requestAnimationFrame(loop);
    }

    function setMode(nextMode){
      mode = nextMode;
      document.querySelectorAll(".ar-toggle-btn").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.mode === nextMode);
      });
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      resetFilters();
      syncTuneUI();
    }

    /* 맞춤(크기/위치) 슬라이더 */
    el("tuneBtn").onclick = () => {
      el("tunePanel").hidden = !el("tunePanel").hidden;
    };

    function onTuneInput(){
      TUNE[mode].size = parseInt(el("tuneSize").value, 10);
      TUNE[mode].shift = parseInt(el("tuneShift").value, 10);
      syncTuneUI();
      saveTune();
    }
    el("tuneSize").addEventListener("input", onTuneInput);
    el("tuneShift").addEventListener("input", onTuneInput);
    el("tuneReset").onclick = () => {
      TUNE[mode].size = 100;
      TUNE[mode].shift = 0;
      syncTuneUI();
      saveTune();
    };

    el("modeWatchBtn").onclick = () => setMode("watch");
    el("modeRingBtn").onclick = () => setMode("ring");

    el("startBtn").onclick = async () => {
      showScreen("screen-ar");
      setMode("watch");
      resizeCanvas();
      const ok = await openCamera();
      if (!ok) return;
      if (!IMAGES.watch) {
        IMAGES.watch = await loadCroppedImage("../assets/img/ar/watch-real.png");
        IMAGES.watchSide = await loadCroppedImage("../assets/img/ar/watch-side.svg");
        IMAGES.ring = await loadCroppedImage("../assets/img/ar/ring-real.png");
      }
      loopActive = true;
      if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(loop);
      else requestAnimationFrame(loop);
    };

    el("closeArBtn").onclick = () => {
      closeCamera();
      showScreen("screen-intro");
    };
  </script>
</body>
</html>
