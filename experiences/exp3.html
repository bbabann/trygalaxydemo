<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Display | Try Galaxy Demo</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/privacydisplay.css" />
</head>
<body>
  <div class="app-frame">
    <div class="experience-page">
      <section class="screen" id="screen-intro">
        <h1>Privacy Display</h1>
        <p class="hint">화면을 좌우로 기울이면, 기울인 각도에 따라 화면이 점점 검게 가려집니다. 정면에서는 그대로 보이고, 45도 이상 기울이면 거의 보이지 않습니다.</p>
        <button class="btn btn-primary" id="startBtn">시작하기</button>
        <a class="back-link" href="../index.html">← 홈으로 돌아가기</a>
      </section>
    </div>

    <section class="screen privacy-screen" id="screen-display" hidden>
      <div class="home-content">
        <div class="widget-row">
          <div class="widget-weather">
            <div class="deg">24°</div>
            <div class="desc">부분적으로 흐림</div>
            <div class="desc">↑24° / ↓20° · 현재 위치</div>
          </div>
          <div class="widget-mini">
            <div class="pill-card">기억해 두세요</div>
            <div class="ring-card">4,350 · 76 · 458</div>
          </div>
        </div>

        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
          <span style="flex:1"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3" /><path d="M5 11a7 7 0 0 0 14 0" /><line x1="12" y1="18" x2="12" y2="22" /></svg>
        </div>

        <div class="app-grid">
          <div class="app-icon">
            <div class="glyph" style="background:#4f6df5"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" /><path d="M4 9h16" /></svg></div>
            <span>앱 1</span>
          </div>
          <div class="app-icon">
            <div class="glyph" style="background:#d9598a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8" /><path d="M12 8v4l3 2" /></svg></div>
            <span>앱 2</span>
          </div>
          <div class="app-icon">
            <div class="glyph" style="background:#2fa77f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10a7 7 0 0 1 14 0c0 5.5-7 10-7 10Z" /></svg></div>
            <span>앱 3</span>
          </div>
          <div class="app-icon">
            <div class="glyph" style="background:#2b2b2e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2.1-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2.1 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3.9 2.1 1.2L10 21h4l.5-2.6a7 7 0 0 0 2.1-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z" /></svg></div>
            <span>앱 4</span>
          </div>
        </div>
      </div>

      <div class="dock">
        <div class="glyph" style="background:#3ab54a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8 10.3a16 16 0 0 0 6 6l1.5-1.4a2 2 0 0 1 2.1-.4c1 .3 2 .5 3 .7a2 2 0 0 1 1.7 2Z" /></svg></div>
        <div class="glyph" style="background:#2f8be6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4A8.7 8.7 0 0 1 8 19l-5 1 1-4.7A8.4 8.4 0 0 1 20 7a8.3 8.3 0 0 1 1 4.5Z" /></svg></div>
        <div class="glyph" style="background:#e85d8a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="M21 15l-5-5L5 21" /></svg></div>
        <div class="glyph" style="background:#555"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" /><circle cx="12" cy="13" r="4" /></svg></div>
      </div>

      <div class="privacy-overlay" id="privacyOverlay"></div>

      <button class="home-back" id="closeDisplayBtn" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18" /><line x1="18" y1="6" x2="6" y2="18" /></svg>
      </button>

      <div class="tilt-debug" id="tiltDebug">0°</div>

      <button class="btn btn-primary permission-card" id="permissionBtn" hidden>기울기 센서 사용 허용</button>
    </section>
  </div>

  <script>
    const el = (id) => document.getElementById(id);
    const MAX_ANGLE = 45;
    const MAX_OPACITY = 0.9;

    function showScreen(id){
      document.querySelectorAll(".screen").forEach(s => s.hidden = (s.id !== id));
    }

    function applyTilt(gamma){
      if (typeof gamma !== "number") return;
      const clampedAngle = Math.min(Math.abs(gamma), MAX_ANGLE);
      const opacity = (clampedAngle / MAX_ANGLE) * MAX_OPACITY;
      el("privacyOverlay").style.opacity = opacity.toFixed(3);
      el("tiltDebug").textContent = Math.round(gamma) + "°";
    }

    function onOrientation(e){
      applyTilt(e.gamma);
    }

    function startTiltWatch(){
      window.addEventListener("deviceorientation", onOrientation);
    }

    function stopTiltWatch(){
      window.removeEventListener("deviceorientation", onOrientation);
      applyTilt(0);
    }

    async function enterDisplay(){
      showScreen("screen-display");
      el("permissionBtn").hidden = true;

      const needsPermission = typeof DeviceOrientationEvent !== "undefined"
        && typeof DeviceOrientationEvent.requestPermission === "function";

      if (needsPermission) {
        el("permissionBtn").hidden = false;
        el("permissionBtn").onclick = async () => {
          try {
            const result = await DeviceOrientationEvent.requestPermission();
            if (result === "granted") {
              el("permissionBtn").hidden = true;
              startTiltWatch();
            } else {
              el("permissionBtn").textContent = "센서 권한이 거부되었습니다";
            }
          } catch (err) {
            el("permissionBtn").textContent = "센서를 사용할 수 없습니다";
          }
        };
      } else {
        startTiltWatch();
      }
    }

    el("startBtn").onclick = () => enterDisplay();
    el("closeDisplayBtn").onclick = () => {
      stopTiltWatch();
      showScreen("screen-intro");
    };
  </script>
</body>
</html>
