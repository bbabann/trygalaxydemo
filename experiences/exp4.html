<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Switch | Try Galaxy Demo</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/smartswitch.css" />
</head>
<body>
  <div class="app-frame">
    <div class="experience-page">
      <section class="screen" id="screen-intro">
        <h1>Smart Switch</h1>
        <p class="hint">화면을 탭할 때마다 iOS와 Galaxy의 스마트 스위치 진행 화면이 번갈아 넘어갑니다.</p>
        <button class="btn btn-primary" id="startBtn">시작하기</button>
        <a class="back-link" href="../index.html">← 홈으로 돌아가기</a>
      </section>
    </div>

    <section class="screen splitview-screen" id="screen-splitview" hidden>
      <button class="splitview-back" id="closeSplitBtn" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
      </button>

      <div class="stage" id="stage">
        <div class="panel panel--top" data-role="active" id="panelTop">
          <div class="ss-device">
            <span class="ss-pill">iOS</span>
            <div class="ss-frame ios">
              <div class="ss-screen">
                <img id="imgTop" src="../assets/img/smartswitch/ios/1.png" alt="iOS 화면 1" />
              </div>
            <img class="ss-frame-img" src="../assets/img/smartswitch/frame-ios.png" alt="" />
            </div>
            <p class="ss-caption">화면 <b id="stepTop">1</b></p>
          </div>
        </div>
        <div class="panel panel--bottom" data-role="rest" id="panelBottom">
          <div class="ss-device">
            <span class="ss-pill">Galaxy</span>
            <div class="ss-frame galaxy">
              <div class="ss-screen">
                <img id="imgBottom" src="../assets/img/smartswitch/galaxy/1.png" alt="Galaxy 화면 1" />
              </div>
            <img class="ss-frame-img" src="../assets/img/smartswitch/frame-android.png" alt="" />
            </div>
            <p class="ss-caption">화면 <b id="stepBottom">1</b></p>
          </div>
        </div>

        <div class="ss-connector" id="ssConnector" hidden>
          <svg class="ss-connector-line" viewBox="0 0 4 84" preserveAspectRatio="none">
            <line x1="2" y1="0" x2="2" y2="84" />
          </svg>
        </div>

        <div class="ss-resize-handle" id="ssResizeHandle" aria-label="두 화면 비율 드래그로 조절"></div>
      </div>

      <div class="qr-scan-layer" id="qrScanLayer"></div>

      <!-- 모든 화면이 끝나면 오른쪽 아래에 나타나는 시나리오 전환 버튼 -->
      <button class="ss-next-btn" id="ssNextBtn" hidden></button>

      <!-- 시작 인트로: 기기 감지 로딩 → iPhone 화면 → 두 화면으로 분할 -->
      <div class="ss-intro" id="ssIntro" data-phase="detect" hidden>
        <p class="ss-intro-title" id="ssIntroTitle">Detecting your phone...</p>
        <div class="ss-spinner" aria-hidden="true"></div>
        <div class="ss-intro-device">
          <div class="ss-device">
            <span class="ss-pill">iOS</span>
            <div class="ss-frame ios">
              <div class="ss-screen">
                <img src="../assets/img/smartswitch/ios/1.png" alt="iPhone 화면" />
              </div>
            <img class="ss-frame-img" src="../assets/img/smartswitch/frame-ios.png" alt="" />
            </div>
            <p class="ss-caption">화면 <b>1</b></p>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const el = (id) => document.getElementById(id);

    function showScreen(id){
      document.querySelectorAll(".screen").forEach(s => s.hidden = (s.id !== id));
    }

    const stage = el("stage");
    const nextBtn = el("ssNextBtn");
    const panelTop = el("panelTop");
    const panelBottom = el("panelBottom");
    const imgTop = el("imgTop");
    const imgBottom = el("imgBottom");
    const stepTopEl = el("stepTop");
    const stepBottomEl = el("stepBottom");

    // 시나리오 정의: 폴더에 실제로 존재하는 번호만 적어둠
    const IMG = "../assets/img/smartswitch/";
    const SCENARIOS = {
      i2g: {
        intro: "You are using iPhone!",
        top: { pill: "iOS", frameClass: "ios", frame: IMG + "frame-ios.png", folder: IMG + "ios", ext: "png", nums: [1, 2, 3, 4, 5, 6, 7, 9, 14] },
        bottom: { pill: "Galaxy", frameClass: "galaxy", frame: IMG + "frame-android.png", folder: IMG + "galaxy", ext: "png", nums: [1, 2, 4, 5, 7, 8, 9, 10, 11, 12, 13, 14] },
        qrStep: 5,          // 양쪽이 이 번호에 도달하면 QR 스캔 연출
        burstStep: 7,       // 위쪽이 이 번호가 되는 순간 연결 완료 연출
        connectorFrom: 7,   // 위쪽이 이 번호부터 두 기기 사이 연결 표시
        transferFrom: 9,    // 위쪽이 이 번호부터 전송 연출 시작
        transferStopBottom: 11, // 아래쪽이 이 번호가 되면 전송 연출 종료
        next: { key: "g2g", label: "Galaxy to Galaxy" },
      },
      g2g: {
        intro: "You are using Galaxy!",
        top: { pill: "Sender", frameClass: "galaxy", frame: IMG + "frame-android.png", folder: IMG + "g2g-sender", ext: "jpg", nums: [1, 2, 4, 5, 6, 10, 13] },
        bottom: { pill: "Receiver", frameClass: "galaxy", frame: IMG + "frame-android.png", folder: IMG + "g2g-receiver", ext: "jpg", nums: [1, 2, 3, 4, 5, 7, 8, 9, 10, 11, 12, 13] },
        qrStep: 4,          // Sender 4(QR 스캔 안내) · Receiver 4(QR 표시)
        burstStep: 6,       // Sender 6(연결 완료)
        connectorFrom: 6,
        transferFrom: 10,   // Sender 10(전송 중)
        transferStopBottom: 11, // Receiver 11(데이터 정리 중)
        next: { key: "i2g", label: "iPhone to Galaxy" },
      },
    };

    let SC = SCENARIOS.i2g;
    let AVAILABLE = { top: SC.top, bottom: SC.bottom };
    let MAX_STEP = Math.max(...SC.top.nums, ...SC.bottom.nums);

    const imgSrc = (side, n) => `${AVAILABLE[side].folder}/${n}.${AVAILABLE[side].ext}`;

    function applyScenario(key){
      SC = SCENARIOS[key];
      AVAILABLE = { top: SC.top, bottom: SC.bottom };
      MAX_STEP = Math.max(...SC.top.nums, ...SC.bottom.nums);

      [["top", panelTop], ["bottom", panelBottom]].forEach(([side, panel]) => {
        const cfg = SC[side];
        panel.querySelector(".ss-pill").textContent = cfg.pill;
        panel.querySelector(".ss-frame").className = "ss-frame " + cfg.frameClass;
        panel.querySelector(".ss-frame-img").src = cfg.frame;
      });

      // 인트로에 보이는 폰은 위쪽(첫 번째) 기기와 동일
      const introFrame = intro.querySelector(".ss-frame");
      introFrame.className = "ss-frame " + SC.top.frameClass;
      introFrame.querySelector(".ss-frame-img").src = SC.top.frame;
      intro.querySelector(".ss-pill").textContent = SC.top.pill;
      intro.querySelector(".ss-screen img").src = imgSrc("top", 1);
    }

    let step = 1;
    let active = "top";
    let shown = { top: 1, bottom: 1 };
    // 현재 번호에서 아직 처리 못한 쪽들 — 양쪽 다 있으면 위쪽 먼저 → 아래쪽 순으로 한 탭씩 소비
    let queue = [];

    function queueForStep(n){
      const q = [];
      if (AVAILABLE.top.nums.includes(n)) q.push("top");
      if (AVAILABLE.bottom.nums.includes(n)) q.push("bottom");
      return q;
    }

    /* 위 패널 비율(%) — 탭하면 66.667/33.333으로 스냅되고, 핸들을 드래그하면 자유롭게 바뀐다 */
    const MIN_RATIO = 18;
    const MAX_RATIO = 82;

    function setSplitRatio(topPercent){
      const p = Math.max(MIN_RATIO, Math.min(MAX_RATIO, topPercent));
      panelTop.style.flexBasis = p + "%";
      panelBottom.style.flexBasis = (100 - p) + "%";
      el("ssConnector").style.top = p + "%";
      el("ssResizeHandle").style.top = p + "%";
      return p;
    }

    /* 드래그 중 비율에 비례해 폰 크기·배경·pill 색을 연속적으로 보간 (탭 시 active/rest 상태와 동일한 양 끝값 사용) */
    const REST_SCALE = 0.55;
    const ACTIVE_SCALE = 1.4;
    const COLOR = {
      background: [255, 255, 255],
      muted: [245, 245, 245],
      foreground: [10, 10, 10],
      mutedForeground: [115, 115, 115],
    };
    const lerp = (a, b, t) => a + (b - a) * t;
    const lerpColor = (c1, c2, t) =>
      `rgb(${Math.round(lerp(c1[0], c2[0], t))}, ${Math.round(lerp(c1[1], c2[1], t))}, ${Math.round(lerp(c1[2], c2[2], t))})`;

    function applyDragVisual(topPercent){
      const tTop = (topPercent - MIN_RATIO) / (MAX_RATIO - MIN_RATIO);
      const tBottom = 1 - tTop;

      [{ panel: panelTop, t: tTop }, { panel: panelBottom, t: tBottom }].forEach(({ panel, t }) => {
        panel.querySelector(".ss-device").style.transform = `scale(${lerp(REST_SCALE, ACTIVE_SCALE, t)})`;
        panel.style.backgroundColor = lerpColor(COLOR.muted, COLOR.background, t);
        const pill = panel.querySelector(".ss-pill");
        pill.style.backgroundColor = lerpColor(COLOR.muted, COLOR.foreground, t);
        pill.style.color = lerpColor(COLOR.mutedForeground, COLOR.background, t);
      });
    }

    function clearDragOverrides(){
      [panelTop, panelBottom].forEach((panel) => {
        panel.style.backgroundColor = "";
        panel.querySelector(".ss-device").style.transform = "";
        const pill = panel.querySelector(".ss-pill");
        pill.style.backgroundColor = "";
        pill.style.color = "";
      });
    }

    let hasPlayedQrAnim = false;

    function applyAction(side){
      active = side;
      shown[side] = step;
      (side === "top" ? imgTop : imgBottom).src = imgSrc(side, step);

      clearDragOverrides();
      panelTop.dataset.role = active === "top" ? "active" : "rest";
      panelBottom.dataset.role = active === "bottom" ? "active" : "rest";
      setSplitRatio(active === "top" ? 66.667 : 33.333);

      stepTopEl.textContent = shown.top;
      stepBottomEl.textContent = shown.bottom;

      // iOS·Galaxy 둘 다 "화면 5"(QR 스캔 단계)에 도달하면 위 패널의 폰이 아래로 튀어나와 QR을 찍어가는 연출 재생
      if (!hasPlayedQrAnim && shown.top === SC.qrStep && shown.bottom === SC.qrStep) {
        hasPlayedQrAnim = true;
        setTimeout(playQrScanAnimation, 650); // 패널 리사이즈 트랜지션(620ms)이 끝난 뒤 위치를 측정
      }

      // iOS 화면 6 → 7(연결 완료) 전환: 폰이 5% 작아졌다가 커지며 완료되는 느낌의 바운스
      if (side === "top" && step === SC.burstStep) {
        const frame = panelTop.querySelector(".ss-frame");
        frame.animate([
          { transform: "scale(1)" },
          { transform: "scale(0.95)", offset: 0.35 },
          { transform: "scale(1.08)", offset: 0.65 },
          { transform: "scale(1)" },
        ], { duration: 650, easing: "cubic-bezier(.34,1.56,.64,1)" });

        // 완료 순간 폰 뒤에서 파란 원이 커지며 사라지는 버스트
        const burst = document.createElement("div");
        burst.className = "ss-success-burst";
        panelTop.insertBefore(burst, panelTop.firstChild);
        const burstAnim = burst.animate([
          { transform: "scale(0.3)", opacity: 0.55 },
          { transform: "scale(2.4)", opacity: 0 },
        ], { duration: 700, delay: 150, easing: "ease-out" });
        burstAnim.onfinish = () => burst.remove();
      }

      // 연결 완료 이후로는 두 기기 사이에 데이터가 오가는 연결 표시를 계속 보여줌
      if (shown.top >= SC.connectorFrom) {
        el("ssConnector").hidden = false;
      }

      // iOS 화면 9(전송 중)부터 갤럭시 화면 11(전송 완료)이 되기 전까지: 파란 점선 + 아이콘이 내려가는 연출
      if (shown.bottom >= SC.transferStopBottom) {
        stopTransferEffect();
      } else if (shown.top >= SC.transferFrom) {
        startTransferEffect();
      }
    }

    let transferEffectOn = false;
    let transferIntervalId = null;

    function spawnFallingIcon(){
      const connector = el("ssConnector");
      if (connector.hidden) return;
      const icon = document.createElement("div");
      icon.className = "ss-falling-icon";
      connector.appendChild(icon);
      const anim = icon.animate([
        { top: "-6%", opacity: 0 },
        { top: "12%", opacity: 1, offset: 0.18 },
        { top: "85%", opacity: 1, offset: 0.82 },
        { top: "100%", opacity: 0 },
      ], { duration: 900, easing: "ease-in" });
      anim.onfinish = () => icon.remove();
    }

    function startTransferEffect(){
      if (transferEffectOn) return;
      transferEffectOn = true;
      el("ssConnector").classList.add("is-transferring");
      spawnFallingIcon();
      transferIntervalId = setInterval(spawnFallingIcon, 420);
    }

    function stopTransferEffect(){
      transferEffectOn = false;
      el("ssConnector").classList.remove("is-transferring");
      if (transferIntervalId) { clearInterval(transferIntervalId); transferIntervalId = null; }
      el("ssConnector").querySelectorAll(".ss-falling-icon").forEach((n) => n.remove());
    }

    /* 시작 인트로: Detecting... → You are using iPhone! → 레이아웃이 두 개로 분리 */
    const intro = el("ssIntro");
    const introTitle = el("ssIntroTitle");
    let introActive = false;
    let introTimers = [];

    function introLater(fn, ms){ introTimers.push(setTimeout(fn, ms)); }

    function cancelIntro(){
      introTimers.forEach(clearTimeout);
      introTimers = [];
      introActive = false;
      intro.hidden = true;
      intro.style.opacity = "";
      stage.classList.remove("is-intro");
    }

    function playIntro(){
      introActive = true;
      stage.classList.add("is-intro");
      // 분리 전: iOS 패널이 화면 전체를 차지하고 Galaxy 패널은 접혀 있음
      panelTop.style.flexBasis = "100%";
      panelBottom.style.flexBasis = "0%";
      el("ssConnector").style.top = "100%";
      intro.dataset.phase = "detect";
      introTitle.textContent = "Detecting your phone...";
      intro.style.opacity = "1";
      intro.hidden = false;

      introLater(() => {
        intro.dataset.phase = "found";
        introTitle.textContent = SC.intro;
      }, 1900);

      introLater(() => {
        stage.classList.remove("is-intro");
        setSplitRatio(66.667);          // 620ms 트랜지션으로 위/아래 두 개로 분리
        intro.style.opacity = "0";
      }, 3900);

      introLater(() => {
        intro.hidden = true;
        intro.style.opacity = "";
        introActive = false;
      }, 4600);
    }

    function resetSplitview(){
      cancelIntro();
      step = 1;
      active = "top";
      shown = { top: 1, bottom: 1 };
      queue = [];
      hasPlayedQrAnim = false;
      clearDragOverrides();
      stopTransferEffect();
      el("qrScanLayer").innerHTML = "";
      el("ssConnector").hidden = true;
      panelTop.querySelectorAll(".ss-success-burst").forEach((n) => n.remove());
      panelTop.querySelector(".ss-frame").style.visibility = "";
      imgTop.src = imgSrc("top", 1);
      imgBottom.src = imgSrc("bottom", 1);
      nextBtn.hidden = true;
      panelTop.dataset.role = "active";
      panelBottom.dataset.role = "rest";
      setSplitRatio(66.667);
      stepTopEl.textContent = 1;
      stepBottomEl.textContent = 1;
    }

    /* 위 패널의 폰이 튀어나와 아래 패널의 QR코드를 찍고 돌아오는 연출 */
    function playQrScanAnimation(){
      const sourceFrame = panelTop.querySelector(".ss-frame");
      const targetFrame = panelBottom.querySelector(".ss-frame");
      const layer = el("qrScanLayer");
      if (!sourceFrame || !targetFrame || !layer) return;

      const layerRect = layer.getBoundingClientRect();
      const startRect = sourceFrame.getBoundingClientRect();
      const targetRect = targetFrame.getBoundingClientRect();

      const startX = startRect.left - layerRect.left;
      const startY = startRect.top - layerRect.top;
      // QR코드는 보통 화면 중앙보다 약간 아래쪽에 있음
      const targetCenterX = (targetRect.left - layerRect.left) + targetRect.width / 2;
      const targetCenterY = (targetRect.top - layerRect.top) + targetRect.height * 0.62;

      const startScale = 0.6;
      const peakScale = 0.85;
      const dx = targetCenterX - (startX + (startRect.width * startScale) / 2);
      const dy = targetCenterY - (startY + (startRect.height * startScale) / 2);

      const clone = sourceFrame.cloneNode(true);
      clone.classList.add("qr-flying-frame");
      clone.style.left = startX + "px";
      clone.style.top = startY + "px";
      layer.appendChild(clone);
      sourceFrame.style.visibility = "hidden";

      const anim = clone.animate([
        { transform: `translate(0px, 0px) rotate(0deg) scale(${startScale})`, offset: 0 },
        { transform: `translate(${dx * 0.9}px, ${dy * 0.9}px) rotate(-12deg) scale(${peakScale})`, offset: 0.42 },
        { transform: `translate(${dx}px, ${dy}px) rotate(-8deg) scale(${peakScale})`, offset: 0.5 },
        { transform: `translate(${dx}px, ${dy}px) rotate(-8deg) scale(${peakScale * 1.06})`, offset: 0.62 },
        { transform: `translate(${dx}px, ${dy}px) rotate(-8deg) scale(${peakScale})`, offset: 0.74 },
        { transform: `translate(0px, 0px) rotate(0deg) scale(${startScale})`, offset: 1 },
      ], { duration: 1900, easing: "cubic-bezier(.22,.61,.36,1)" });

      // 폰이 도착하는 타이밍에 QR 지점에서 스캔 플래시(펄스 링) 표시
      setTimeout(() => {
        const pulse = document.createElement("div");
        pulse.className = "qr-scan-pulse";
        pulse.style.left = targetCenterX + "px";
        pulse.style.top = targetCenterY + "px";
        layer.appendChild(pulse);
        const pulseAnim = pulse.animate([
          { transform: "scale(0.4)", opacity: 0.9 },
          { transform: "scale(1.6)", opacity: 0 },
        ], { duration: 650, easing: "ease-out" });
        pulseAnim.onfinish = () => pulse.remove();
      }, 1900 * 0.5);

      anim.onfinish = () => {
        clone.remove();
        sourceFrame.style.visibility = "";
      };
    }

    stage.addEventListener("click", () => {
      if (introActive) return;
      // 현재 번호에 남은 처리가 없으면, 다음 번호로 넘어가서 큐를 새로 만든다
      while (queue.length === 0) {
        if (step >= MAX_STEP) return;
        step += 1;
        queue = queueForStep(step);
      }
      const side = queue.shift();
      applyAction(side);

      // 마지막 화면까지 모두 끝나면 다른 시나리오로 이동하는 버튼을 보여줌
      if (step >= MAX_STEP && queue.length === 0) {
        nextBtn.textContent = SC.next.label;
        setTimeout(() => { if (step >= MAX_STEP && queue.length === 0) nextBtn.hidden = false; }, 700);
      }
    });

    function startScenario(key){
      applyScenario(key);
      resetSplitview();
      showScreen("screen-splitview");
      playIntro();
    }

    el("startBtn").onclick = () => startScenario("i2g");

    nextBtn.onclick = (e) => {
      e.stopPropagation();
      startScenario(SC.next.key);
    };

    el("closeSplitBtn").onclick = (e) => {
      e.stopPropagation();
      cancelIntro();
      nextBtn.hidden = true;
      showScreen("screen-intro");
    };

    /* 경계선 핸들 드래그 — 탭 흐름과 별개로 두 패널 비율을 자유롭게 조절 */
    const resizeHandle = el("ssResizeHandle");

    resizeHandle.addEventListener("click", (e) => e.stopPropagation());

    resizeHandle.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      resizeHandle.setPointerCapture(e.pointerId);
      stage.classList.add("is-dragging");

      const onMove = (ev) => {
        const stageRect = stage.getBoundingClientRect();
        const percent = ((ev.clientY - stageRect.top) / stageRect.height) * 100;
        const applied = setSplitRatio(percent);
        applyDragVisual(applied);
      };
      const onUp = (ev) => {
        stage.classList.remove("is-dragging");
        resizeHandle.releasePointerCapture(e.pointerId);
        resizeHandle.removeEventListener("pointermove", onMove);
        resizeHandle.removeEventListener("pointerup", onUp);
      };
      resizeHandle.addEventListener("pointermove", onMove);
      resizeHandle.addEventListener("pointerup", onUp);
    });
  </script>
</body>
</html>
